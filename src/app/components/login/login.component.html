<div class="login-page">
  <div class="login-form">
    <br><br>

    <!-- Login form -->
    <form (ngSubmit)="login()" *ngIf="activeView === 'login'" [formGroup]="loginForm">
      <h2>Login</h2>
      <br>
      <div class="inputbox">
        <input type="text" formControlName="neptunCode" placeholder="neptun code">
      </div>
      <br>
      <div class="inputbox">
        <input type="password" formControlName="password" placeholder="password">
      </div>
      <br>
      <div *ngIf="errorStatus" class="error-message">
        <span *ngIf="errorStatus === 401">Invalid credentials.</span>
        <span *ngIf="errorStatus !== 401">An error occurred ({{ errorStatus }}).</span>
      </div>
      <button class="inputbox" type="submit" [disabled]="loginForm.invalid || isLoading">
        {{ isLoading ? 'Logging in…' : 'Login' }}
      </button>
    </form>

    <!-- Register form -->
    <form (ngSubmit)="register()" *ngIf="activeView === 'register'" [formGroup]="registrationForm">
      <h2>Register</h2>
      <br>
      <div class="inputbox">
        <input type="text" formControlName="neptunCode" placeholder="neptun code">
      </div>
      <br>
      <div class="inputbox">
        <input type="text" formControlName="email" placeholder="email">
      </div>
      <br>
      <div class="inputbox">
        <input type="password" formControlName="password" placeholder="password">
      </div>
      <br>
      <div class="inputbox">
        <input type="password" formControlName="confirmPassword" placeholder="confirm password">
      </div>
      <div *ngIf="registrationForm.errors?.['passwordMismatch']" class="error-message">
        Passwords do not match.
      </div>
      <br>
      <div *ngIf="errorStatus" class="error-message">
        Registration failed ({{ errorStatus }}).
      </div>
      <button class="inputbox" type="submit" [disabled]="registrationForm.invalid || isLoading">
        {{ isLoading ? 'Registering…' : 'Register' }}
      </button>
    </form>

    <!-- View toggle -->
    <div class="buttons">
      <button (click)="showLoginForm()"    *ngIf="activeView === 'register'">Back to Login</button>
      <button (click)="showRegisterForm()" *ngIf="activeView === 'login'">Register</button>
    </div>

  </div>
</div>
