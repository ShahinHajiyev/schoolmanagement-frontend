<nav class="sidebar">

  <!-- Brand + mobile close -->
  <div class="sidebar-header">
    <button class="close-btn" (click)="closeRequest.emit()" aria-label="Close menu">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
    <div class="brand-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>
      </svg>
    </div>
    <span class="brand-name">SchoolMS</span>
  </div>

  <!-- Navigation -->
  <ul class="sidebar-nav" role="list">
    <li *ngFor="let item of menuItems; trackBy: trackByPath">
      <a
        class="nav-item"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: false }"
        [attr.aria-label]="item.name"
      >
        <span class="nav-icon" [innerHTML]="getIcon(item.path)"></span>
        <span class="nav-label">{{ item.name }}</span>
      </a>
    </li>
  </ul>

  <!-- User + Logout -->
  <div class="sidebar-footer">
    <div class="user-info">
      <div class="user-avatar">{{ userInitial }}</div>
      <span class="user-name">{{ loggedUser }}</span>
    </div>
    <button class="logout-btn" (click)="logout()" title="Log out">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </button>
  </div>

</nav>
