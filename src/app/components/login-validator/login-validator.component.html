<div class="activation-page">
  <div class="activation-card">

    <div class="activation-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24"
           fill="none" stroke="#e53e3e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>

    <h2>Account Activation</h2>
    <p class="subtitle">Enter the 6-character code sent to your email</p>

    <div class="neptun-badge">{{ neptunCode }}</div>

    <form (ngSubmit)="activateAccount()" [formGroup]="activationForm">
      <div class="inputbox">
        <input
          type="text"
          formControlName="activationCode"
          placeholder="e.g. aB3xY9"
          maxlength="6"
          autocomplete="one-time-code"
          spellcheck="false">
      </div>

      <div *ngIf="errorStatus" class="error-message">
        <span *ngIf="errorStatus === 400">Invalid or expired activation code.</span>
        <span *ngIf="errorStatus !== 400">Something went wrong ({{ errorStatus }}).</span>
      </div>

      <button class="btn-primary" type="submit" [disabled]="activationForm.invalid || isLoading">
        {{ isLoading ? 'Activating…' : 'Activate Account' }}
      </button>
    </form>

    <div class="resend-section">
      <span class="resend-label">Didn't receive a code?</span>
      <button class="btn-resend"
              (click)="resendCode()"
              [disabled]="resendState === 'loading' || resendState === 'success'">
        <ng-container [ngSwitch]="resendState">
          <span *ngSwitchCase="'loading'">Sending…</span>
          <span *ngSwitchCase="'success'">✓ Code sent</span>
          <span *ngSwitchCase="'error'">Failed — try again</span>
          <span *ngSwitchDefault>Resend code</span>
        </ng-container>
      </button>
    </div>

  </div>
</div>
