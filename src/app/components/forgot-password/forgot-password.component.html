<div class="auth-page">
  <div class="auth-card">
    <h2 class="auth-title">Forgot Password</h2>

    <ng-container *ngIf="submitState !== 'success'; else successMsg">
      <p class="auth-subtitle">Enter your email address and we'll send you a reset link.</p>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="field">
          <input
            class="input"
            type="email"
            formControlName="email"
            placeholder="your@email.com"
            autocomplete="email" />
        </div>
        <button
          class="btn-primary"
          type="submit"
          [disabled]="form.invalid || submitState === 'loading'">
          {{ submitState === 'loading' ? 'Sending...' : 'Send Reset Link' }}
        </button>
      </form>
    </ng-container>

    <ng-template #successMsg>
      <p class="success-msg">If this email exists, a reset link has been sent.</p>
    </ng-template>

    <a class="back-link" routerLink="/login">&#8592; Back to Login</a>
  </div>
</div>
