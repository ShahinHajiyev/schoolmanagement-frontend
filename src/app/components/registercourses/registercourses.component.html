<div class="register-container">
    <div class="register-checkpoint">
        <p><strong>Tuition fee: </strong>ok</p>
        <p><strong>Preconditions: </strong>ok</p>
        <p><strong>Attendance: </strong>ok</p>
    </div>
    <button (click)="registerCourse()" [disabled]="isLoading">
        {{ isLoading ? 'Registering...' : 'Register' }}
    </button>
    <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>
</div>
