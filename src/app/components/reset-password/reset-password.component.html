<div class="auth-page">
  <div class="auth-card">
    <h2 class="auth-title">Reset Password</h2>

    <ng-container *ngIf="submitState !== 'success'; else successMsg">
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="field">
          <label class="label">New Password</label>
          <input class="input" type="password" formControlName="newPassword" placeholder="Min. 6 characters" />
          <span class="field-error" *ngIf="form.get('newPassword')?.touched && form.get('newPassword')?.hasError('minlength')">
            At least 6 characters required.
          </span>
        </div>
        <div class="field">
          <label class="label">Confirm Password</label>
          <input class="input" type="password" formControlName="confirmPassword" placeholder="Repeat password" />
        </div>
        <span class="field-error" *ngIf="form.errors?.['passwordMismatch'] && form.get('confirmPassword')?.touched">
          Passwords do not match.
        </span>
        <p class="feedback-error" *ngIf="submitState === 'error'">{{ errorMessage ?? 'Reset failed. The link may have expired.' }}</p>
        <button
          class="btn-primary"
          type="submit"
          [disabled]="form.invalid || submitState === 'loading'">
          {{ submitState === 'loading' ? 'Resetting...' : 'Reset Password' }}
        </button>
      </form>
    </ng-container>

    <ng-template #successMsg>
      <p class="success-msg">Password reset! Redirecting to login...</p>
    </ng-template>

    <a class="back-link" routerLink="/login">&#8592; Back to Login</a>
  </div>
</div>
